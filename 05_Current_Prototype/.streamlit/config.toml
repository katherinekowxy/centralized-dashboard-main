[theme]
# Gardens by the Bay tokens (demo/brand.py): white background, brand pink for primary actions and selection only.
base = "light"
primaryColor = "#E2124F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F7"
textColor = "#24272A"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true  # serves static/ (the Bay South map) at app/static/

[client]
toolbarMode = "minimal"
